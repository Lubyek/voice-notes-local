<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PeopleDo · Расшифровка</title>
  <link rel="stylesheet" href="./panel.css">
  <script type="module" src="./panel.js"></script>
</head>
<body>
  <main>
    <header>
      <span class="brand">PeopleDo</span>
      <span class="mode">Личная расшифровка</span>
      <button id="hide" class="window-close" type="button" aria-label="Свернуть в трей" title="Свернуть в трей">×</button>
    </header>
    <section id="offer" aria-labelledby="offer-title" hidden>
      <div class="offer-icon" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="offer-copy">
        <h1 id="offer-title">Микрофон включён</h1>
        <p id="offer-text">Начать личную расшифровку?</p>
      </div>
      <button id="dismiss" class="window-close" type="button" aria-label="Пропустить" title="Пропустить">×</button>
      <div class="offer-actions">
        <button id="accept" class="primary" type="button">Транскрибировать</button>
        <button id="offer-stop" type="button" hidden>Завершить</button>
      </div>
    </section>
    <section id="recording-controls" aria-label="Управление расшифровкой">
      <p id="status" role="status">Ожидаем активности микрофона</p>
      <p id="error" role="alert" hidden></p>
      <div id="controls" class="actions">
        <button id="start" class="primary">Начать запись</button>
        <button id="pause" hidden>Пауза</button>
        <button id="resume" class="primary" hidden>Возобновить</button>
        <button id="stop" hidden>Завершить</button>
      </div>
    </section>
    <section id="result" aria-label="Результат расшифровки" hidden>
      <h2>Расшифровка</h2>
      <p id="raw"></p>
      <h2 id="clean-title" hidden>Очищенный текст</h2>
      <p id="clean" hidden></p>
    </section>
  </main>
</body>
</html>
