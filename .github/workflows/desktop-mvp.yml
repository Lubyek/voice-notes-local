name: PeopleDo for Omarchy

on:
  push:
    branches: [desktop-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omarchy:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the Arch Linux build dependencies
        run: pacman -Syu --noconfirm --needed git nodejs npm electron44 zstd
      - uses: actions/checkout@v4
      - run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: PeopleDo-Omarchy-x86_64
          path: desktop-build/PeopleDo-*-Omarchy-x86_64.tar.zst
          if-no-files-found: error
          compression-level: 0
